plugins { id 'com.android.application' }

android {
    namespace 'com.rokid.scanvision.glasses'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rokid.scanvision.glasses'
        minSdk 28
        targetSdk 34
        versionCode 7
        versionName '0.5.0'
    }
}

dependencies {
    implementation 'com.rokid.cxr:cxr-service-bridge:1.0-20260728.074302-110'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'com.google.mediapipe:tasks-vision:0.10.26'
}
