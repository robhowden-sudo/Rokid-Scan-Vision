name: Build Rokid Vision APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build phone and glasses debug APKs
        run: gradle --no-daemon --stacktrace :phone:assembleDebug :glasses:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Scan-Vision-Phone-debug
          path: phone/build/outputs/apk/debug/phone-debug.apk
          if-no-files-found: error

      - name: Upload glasses APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokid-Scan-Vision-Glasses-debug
          path: glasses/build/outputs/apk/debug/glasses-debug.apk
          if-no-files-found: error
