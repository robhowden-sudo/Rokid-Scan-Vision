name: Build Android debug APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build phone and glasses APKs
        run: gradle :phone:assembleDebug :glasses:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Rokid-Scan-Vision-v0.2-debug
          path: |
            phone/build/outputs/apk/debug/*.apk
            glasses/build/outputs/apk/debug/*.apk
          retention-days: 7
