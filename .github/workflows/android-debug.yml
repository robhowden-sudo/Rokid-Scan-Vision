name: Build Rokid glasses debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build glasses APK
        run: gradle :glasses:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Rokid-Scan-Vision-glasses-debug
          path: glasses/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
